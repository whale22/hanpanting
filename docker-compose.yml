services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: hanpanting:ubuntu24.04
    container_name: hanpanting
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env.local
      - .env.docker

    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: hanpanting-mongodb
    restart: unless-stopped

    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
