services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hanpanting:local
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MONGODB_URI: mongodb://mongo:27017/hanpanting_dev
      PORT: "3001"
      CODEX_BRIDGE_DIR: /var/run/codex-bridge
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CODEX_BRIDGE_PATH:-./.docker/codex-bridge}
        target: /var/run/codex-bridge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  mongo:
    image: mongo:8.0.30-noble
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${MONGODB_DATA_PATH}
        target: /data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - quit(db.adminCommand('ping').ok ? 0 : 2)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
